# Muhafiz.sol Configuration File
# Phase 1: Data Foundation and Feature Pipeline

project:
  name: "muhafiz-sol"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  gold_data_dir: "data/gold"
  features_dir: "data/features"
  models_dir: "models"
  reports_dir: "reports"
  docs_dir: "docs"

dataset:
  slither_hf_repo: "mwritescode/slither-audited-smart-contracts"
  slither_config_small: "small-multilabel"
  slither_config_big: "big-multilabel"
  smartbugs_git_repo: "https://github.com/smartbugs/smartbugs-curated.git"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  min_class_prevalence: 0.01  # Minimum ~1% prevalence rule

deduplication:
  exact_hash: "sha256"
  shingle_size: 5
  minhash_num_perm: 128
  jaccard_threshold: 0.80

preprocessing:
  max_token_length: 4096
  protected_keywords:
    - "call"
    - "send"
    - "transfer"
    - "delegatecall"
    - "selfdestruct"
    - "msg.sender"
    - "tx.origin"
    - "block.timestamp"
    - "revert"
    - "assert"
    - "require"

features:
  ngram_range: [1, 3]
  max_features: 10000
  sublinear_tf: true
  svd_components: 512
